<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>HBnB – Place Details</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" href="images/icon.png">
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
  <header>
    <nav>
      <a href="index.html">
        <img src="images/logo.png" alt="HBnB Logo" class="logo">
      </a>
      <a href="login.html" class="login-button" id="login-link">Login</a>
    </nav>
  </header>

  <main>
  <!-- Banner Image -->
  <div id="place-banner">
    <img id="banner-img" src="" alt="Place Banner">
  </div>

  <!-- Place Details (title, description, price, amenities) -->
  <section class="place-details" id="place-details">
    <!-- Populated by JS -->
  </section>

  <!-- Add Review Button -->
  <section id="add-review" style="display: none;">
    <a class="details-button" href="#">Add Review</a>
  </section>

  <!-- Review List -->
  <section id="reviews">
    <h2>Reviews</h2>
    <!-- Populated by JS -->
  </section>
</main>


  <footer>
    <p>All rights reserved.</p>
  </footer>

  <script src="scripts.js"></script>
</body>
</html>
